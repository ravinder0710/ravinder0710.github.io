<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#040912"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#10b981" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Badge -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.2"/>

  <!-- Bold Modern Sans-Serif Monogram RG -->
  <text x="26.5" y="41.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Montserrat', Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.8">RG</text>

  <!-- Glowing Live Telemetry Dot at Top Right -->
  <circle cx="48" cy="18.5" r="4.5" fill="#10b981" filter="url(#glow)"/>
  <circle cx="48" cy="18.5" r="2.8" fill="#6ee7b7"/>
</svg>
